<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- wee wee: a child leaning over an open toilet, looking into the bowl -->
  <rect width="200" height="200" fill="#eaf4fb"/>
  <rect x="0" y="150" width="200" height="50" fill="#d9e3ea"/>
  <!-- toilet: tank, lid up, bowl -->
  <rect x="96" y="22" width="72" height="30" rx="7" fill="#ffffff" stroke="#8aa0b2" stroke-width="4"/>
  <!-- the lid, up -->
  <rect x="104" y="40" width="56" height="58" rx="26" fill="#f4f7fa" stroke="#8aa0b2" stroke-width="4"/>
  <rect x="114" y="50" width="36" height="38" rx="17" fill="none" stroke="#dbe4ec" stroke-width="3"/>
  <ellipse cx="132" cy="104" rx="46" ry="14" fill="#ffffff" stroke="#8aa0b2" stroke-width="4"/>
  <ellipse cx="132" cy="104" rx="32" ry="8" fill="#9fd3f7"/>
  <path d="M90 108 Q96 148 116 156 h32 Q168 148 174 108" fill="#ffffff" stroke="#8aa0b2" stroke-width="4"/>
  <rect x="112" y="154" width="40" height="10" rx="3" fill="#ffffff" stroke="#8aa0b2" stroke-width="4"/>
  <!-- child: body standing at the left, head tilted toward the bowl -->
  <rect x="34" y="104" width="40" height="52" rx="14" fill="#f39a45"/>
  <rect x="38" y="152" width="12" height="26" rx="5" fill="#3b5b8c"/>
  <rect x="58" y="152" width="12" height="26" rx="5" fill="#3b5b8c"/>
  <g transform="rotate(22 60 84)">
    <circle cx="60" cy="84" r="24" fill="#f3c79c"/>
    <path d="M36 80 Q40 56 62 58 Q84 58 84 80 Q74 70 60 70 Q46 70 36 80z" fill="#2b2f45"/>
    <circle cx="68" cy="88" r="3.5" fill="#1f2a37"/>
    <circle cx="54" cy="88" r="3.5" fill="#1f2a37"/>
    <path d="M56 98 Q61 102 66 98" stroke="#1f2a37" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  </g>
  <!-- looking into the bowl -->
  <path d="M84 96 Q104 96 116 102" stroke="#5aa4e6" stroke-width="3" stroke-dasharray="4 5" fill="none" stroke-linecap="round"/>
</svg>
